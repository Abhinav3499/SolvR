<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: white;
    }
    h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .problem-title {
      font-weight: 600;
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .meta-tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-weight: 600;
      margin-right: 4px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #059669, #0891b2);
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .settings-link {
      font-size: 11px;
      color: #94a3b8;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 8px;
      display: block;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">S</div>
    <h3>SolvR Importer</h3>
  </div>

  <div id="detected-container" class="card">
    <div id="prob-title" class="problem-title">Detecting active problem...</div>
    <div>
      <span id="prob-platform" class="meta-tag">-</span>
      <span id="prob-difficulty" class="meta-tag">-</span>
    </div>
  </div>

  <button id="add-btn" class="btn">Add to SolvR Sheet</button>

  <script src="popup.js"></script>
</body>
</html>
